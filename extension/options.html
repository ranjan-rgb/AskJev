<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AskJev options</title>
  <style>
    body{font-family:ui-sans-serif,system-ui,sans-serif;background:#09090b;color:#fafafa;margin:0;padding:40px;max-width:640px}
    h1{font-size:22px;margin:0 0 6px}
    .sub{color:#a1a1aa;margin:0 0 28px;font-size:14px;line-height:1.5}
    label{display:block;font-size:12px;color:#a1a1aa;margin:16px 0 6px}
    input,select,textarea{width:100%;box-sizing:border-box;background:#18181b;border:1px solid #27272a;color:#fafafa;border-radius:10px;padding:10px 12px;font:inherit}
    textarea{min-height:80px;resize:vertical}
    button{margin-top:20px;background:#fafafa;color:#09090b;border:0;border-radius:10px;padding:10px 16px;font-weight:650;cursor:pointer}
    .ok{color:#4ade80;font-size:13px;margin-left:10px}
    a{color:#a1a1aa}
  </style>
</head>
<body>
  <h1>AskJev</h1>
  <p class="sub">Connect TypeSafe Jev. Protection is <strong>on for every site</strong> by default. Allowlist only hosts you trust. Key stays in Chrome sync and is sent only to <code>api.typesafe.ai</code>.</p>
  <label for="apiKey">TypeSafe API key</label>
  <input id="apiKey" type="password" placeholder="tsk_..." autocomplete="off" />
  <label for="sensitivity">Sensitivity</label>
  <select id="sensitivity">
    <option value="chill">Chill</option>
    <option value="balanced" selected>Balanced</option>
    <option value="paranoid">Paranoid</option>
  </select>
  <label for="keywords">Extra keywords (comma-separated)</label>
  <input id="keywords" placeholder="refund, revoke, wipe" />
  <label for="allowlist">Allowlist hosts (one per line)</label>
  <textarea id="allowlist" placeholder="localhost"></textarea>
  <label><input type="checkbox" id="enabled" checked /> Protection enabled</label>
  <label><input type="checkbox" id="confirmAsk" checked /> Always show overlay on ask</label>
  <label><input type="checkbox" id="gateForms" /> Also gate all form submits (noisier; good with Paranoid)</label>
  <div><button id="save">Save</button><span class="ok" id="status"></span></div>
  <p class="sub" style="margin-top:28px"><a href="privacy.html">Privacy</a></p>
  <script type="module" src="options.js"></script>
</body>
</html>
