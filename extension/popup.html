<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --line: #27272a;
      --text: #fafafa;
      --mute: #a1a1aa;
      --dim: #71717a;
      --ok: #4ade80;
      --warn: #fbbf24;
      --off: #52525b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 300px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { padding: 14px; }
    .head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo {
      width: 32px; height: 32px;
      border-radius: 9px;
      background: var(--card);
      border: 1px solid var(--line);
      display: grid; place-items: center;
      flex-shrink: 0;
    }
    .titles { flex: 1; min-width: 0; }
    .titles h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .titles p {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--dim);
    }
    .switch {
      appearance: none;
      width: 40px; height: 24px;
      border-radius: 999px;
      border: 0;
      background: #3f3f46;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 3px; left: 3px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #fff;
      transition: transform .15s ease;
    }
    .switch.on { background: #fafafa; }
    .switch.on::after { transform: translateX(16px); background: #09090b; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 12px;
    }
    .status-row + .status-row { border-top: 1px solid var(--line); }
    .status-row .l { color: var(--mute); }
    .status-row .r {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      color: var(--text);
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--off);
    }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .metric {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      text-align: left;
    }
    .metric .k { font-size: 11px; color: var(--dim); }
    .metric .n {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .actions { display: grid; gap: 8px; }
    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .btn.primary {
      background: #fafafa;
      color: #09090b;
      border-color: #fafafa;
    }
    .btn:hover { filter: brightness(1.05); }
    .foot {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--dim);
    }
    .foot button {
      appearance: none;
      background: none;
      border: 0;
      color: var(--mute);
      font-size: 11px;
      cursor: pointer;
      padding: 0;
    }
    .foot button:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="logo" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
          <path d="M10 2.5L17 8.2L14.6 9.4L10 12.2L5.4 9.4L3 8.2L10 2.5Z" fill="#FAFAFA"/>
          <path d="M10 7.2L14.2 9.1L10 11.2L5.8 9.1L10 7.2Z" fill="#18181B"/>
          <rect x="6.5" y="14.2" width="7" height="1.4" fill="#A1A1AA"/>
        </svg>
      </div>
      <div class="titles">
        <h1>AskJev</h1>
        <p id="armLabel">Protection on</p>
      </div>
      <button class="switch" id="en" type="button" aria-label="Toggle protection" aria-pressed="true"></button>
    </div>

    <div class="card">
      <div class="status-row">
        <span class="l">API key</span>
        <span class="r"><span class="dot" id="keyDot"></span><span id="key">—</span></span>
      </div>
      <div class="status-row">
        <span class="l">Claude bridge</span>
        <span class="r"><span class="dot" id="bridgeDot"></span><span id="bridge">—</span></span>
      </div>
      <div class="status-row">
        <span class="l">Mode</span>
        <span class="r"><span class="dot ok" id="modeDot"></span><span id="mode">Guard</span></span>
      </div>
    </div>

    <div class="metrics">
      <div class="metric"><div class="k">Blocked</div><div class="n" id="b">0</div></div>
      <div class="metric"><div class="k">Asked</div><div class="n" id="a">0</div></div>
      <div class="metric"><div class="k">Allowed</div><div class="n" id="p">0</div></div>
    </div>

    <div class="actions">
      <button class="btn primary" id="auto" type="button">Open Autopilot</button>
      <button class="btn" id="opts" type="button">Settings</button>
    </div>

    <div class="foot">
      <span id="ver">v1.5.1</span>
      <button type="button" id="docs">Bridge help</button>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
