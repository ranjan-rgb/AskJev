<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body{font-family:ui-sans-serif,system-ui,sans-serif;background:#09090b;color:#fafafa;margin:0;padding:14px;width:300px}
    h1{font-size:14px;margin:0 0 4px}
    .sub{color:#a1a1aa;font-size:11px;margin:0 0 12px}
    .row{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
    .stat{font-variant-numeric:tabular-nums;font-weight:650}
    button.link{color:#fafafa;font-size:12px;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
    .toggle{appearance:none;width:40px;height:22px;background:#27272a;border-radius:999px;position:relative;cursor:pointer;border:0}
    .toggle.on{background:#22c55e}
    .toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:left .15s}
    .toggle.on::after{left:21px}
  </style>
</head>
<body>
  <h1>AskJev</h1>
  <p class="sub">Ask Jev before dangerous clicks — every site</p>
  <div class="row"><span>Protection</span><button class="toggle" id="en" aria-label="toggle"></button></div>
  <div class="row"><span>Blocked</span><span class="stat" id="b">0</span></div>
  <div class="row"><span>Asked</span><span class="stat" id="a">0</span></div>
  <div class="row"><span>Allowed</span><span class="stat" id="p">0</span></div>
  <div class="row" style="margin-top:14px"><button class="link" id="auto">Open Autopilot</button></div>
  <div class="row"><button class="link" id="opts">Open options</button><span class="sub" id="key">no key</span></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
