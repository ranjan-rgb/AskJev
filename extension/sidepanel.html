<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AskJev Autopilot</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="min-h-screen p-4">
  <div class="mb-1.5 flex items-center gap-2.5">
    <div class="grid h-7 w-7 place-items-center rounded-lg border border-zinc-800 bg-zinc-900" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 2.5L17 8.2L14.6 9.4L10 12.2L5.4 9.4L3 8.2L10 2.5Z" fill="#FAFAFA"/>
        <path d="M10 7.2L14.2 9.1L10 11.2L5.8 9.1L10 7.2Z" fill="#18181B"/>
        <rect x="6.5" y="14.2" width="7" height="1.4" fill="#A1A1AA"/>
      </svg>
    </div>
    <h1 class="m-0 text-[15px] font-semibold tracking-tight">Autopilot</h1>
  </div>
  <p class="mb-4 mt-0 text-xs leading-relaxed text-zinc-400">Describe a goal in plain language. Jev picks the next click or type. Guard still stops irreversible actions.</p>
  <label class="aj-label !mt-0" for="goal">Goal</label>
  <textarea id="goal" class="aj-input min-h-[100px] resize-y" placeholder='e.g. open settings and find billing — put exact type text in "quotes"'></textarea>
  <label class="aj-label" for="typeText">Text to type (optional)</label>
  <input id="typeText" class="aj-input" placeholder="Used when Jev chooses TYPE_TEXT" autocomplete="off" />
  <div class="mt-3.5 flex gap-2">
    <button type="button" class="aj-btn-primary flex-1" id="run">Run</button>
    <button type="button" class="aj-btn flex-1" id="stop">Stop</button>
  </div>
  <div id="status" class="mt-3 text-xs tabular-nums text-zinc-400" role="status" aria-live="polite">idle</div>
  <div id="bridgeLine" class="mt-1 text-[11px] tabular-nums text-zinc-500">bridge: off</div>
  <div id="log" class="mt-3 max-h-[45vh] overflow-auto whitespace-pre-wrap rounded-[10px] border border-zinc-800 bg-zinc-925 p-2.5 font-mono text-[11px] leading-relaxed text-zinc-400" aria-label="Autopilot log"></div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
