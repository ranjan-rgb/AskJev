<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AskJev Autopilot</title>
  <style>
    :root {
      --bg:#09090b; --card:#18181b; --line:#27272a;
      --text:#fafafa; --mute:#a1a1aa; --dim:#71717a;
    }
    *{box-sizing:border-box}
    body{
      margin:0; padding:16px;
      background:var(--bg); color:var(--text);
      font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",ui-sans-serif,system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
    .logo{
      width:28px;height:28px;border-radius:8px;
      background:var(--card);border:1px solid var(--line);
      display:grid;place-items:center;
    }
    h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-0.01em}
    .sub{color:var(--mute);font-size:12px;margin:0 0 16px;line-height:1.5}
    label{display:block;font-size:12px;color:var(--dim);margin:12px 0 6px}
    textarea,input{
      width:100%;background:var(--card);border:1px solid var(--line);
      color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;
    }
    textarea{min-height:100px;resize:vertical}
    .row{display:flex;gap:8px;margin-top:14px}
    button{
      flex:1;border:0;border-radius:10px;padding:11px;
      font-weight:600;font-size:12px;cursor:pointer;
    }
    #run{background:#fafafa;color:#09090b}
    #stop{background:var(--card);color:var(--text);border:1px solid var(--line)}
    #status{font-size:12px;color:var(--mute);margin-top:12px}
    #bridgeLine{font-size:11px;color:var(--dim);margin-top:4px}
    #log{
      margin-top:12px;font-size:11px;color:var(--mute);
      white-space:pre-wrap;max-height:45vh;overflow:auto;
      background:var(--card);border:1px solid var(--line);border-radius:10px;
      padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    }
  </style>
</head>
<body>
  <div class="head">
    <div class="logo" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none">
        <path d="M10 2.5L17 8.2L14.6 9.4L10 12.2L5.4 9.4L3 8.2L10 2.5Z" fill="#FAFAFA"/>
        <path d="M10 7.2L14.2 9.1L10 11.2L5.8 9.1L10 7.2Z" fill="#18181B"/>
        <rect x="6.5" y="14.2" width="7" height="1.4" fill="#A1A1AA"/>
      </svg>
    </div>
    <h1>Autopilot</h1>
  </div>
  <p class="sub">Describe a goal. Jev picks the next click or type. Guard still stops irreversible actions.</p>
  <label for="goal">Goal</label>
  <textarea id="goal" placeholder='e.g. open settings and find billing — put exact type text in "quotes"'></textarea>
  <label for="typeText">Text to type (optional)</label>
  <input id="typeText" placeholder="Used when Jev chooses TYPE_TEXT" />
  <div class="row">
    <button id="run">Run</button>
    <button id="stop">Stop</button>
  </div>
  <div id="status">idle</div>
  <div id="bridgeLine">bridge: off</div>
  <div id="log"></div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
