name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json

      # Root postinstall runs `npm install --prefix mcp`; the extra `npm ci`
      # pins mcp deps to mcp/package-lock.json instead of resolving fresh.
      - run: npm ci
      - run: npm ci --prefix mcp

      - run: npm run typecheck
      - run: npm test
